name: build-8ubah-apk

# Builds a ready-to-install (debug-signed) APK in the cloud.
# Debug signing is fine for an Xposed module — LSPosed / LSPatch don't care
# about the signature. Push to GitHub, or run it manually from the Actions tab,
# then download the APK from the run's "Artifacts".

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 8ubah-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
