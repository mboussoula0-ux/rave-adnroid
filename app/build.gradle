plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eightubah.mod'
    compileSdk 34

    defaultConfig {
        applicationId 'com.eightubah.mod'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // We ship no resources and no R class; everything is built programmatically,
    // exactly like the iOS build (no XIBs / storyboards).
    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // Xposed API — needed only to compile against; it is provided by the
    // LSPosed/LSPatch framework at runtime, so compileOnly.
    compileOnly 'de.robv.android.xposed:api:82'
}
